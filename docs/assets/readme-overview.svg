<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">같이온 — 자녀가 준비하고, 부모님이 고르는 여행</title>
<desc id="desc">후보 준비, 부모님 취향 선택, 일정 비교와 확인으로 이어지는 가족 여행 서비스 소개. 하단 화면은 기능 설명용 도식이며 모든 예시는 가상 데이터입니다.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf6e9"/><stop offset="1" stop-color="#fbf9ee"/></linearGradient><clipPath id="round"><rect width="1600" height="1040" rx="40"/></clipPath></defs>
<g clip-path="url(#round)"><rect width="1600" height="1040" fill="url(#bg)"/>
<circle cx="1450" cy="30" r="270" fill="#dbeccd"/><circle cx="1500" cy="75" r="185" fill="#e7f1de"/>
<g font-family="SUIT, sans-serif" fill="#203d30">
<rect x="72" y="64" width="66" height="66" rx="23" fill="#36744b"/><text x="105" y="109" text-anchor="middle" font-size="37" font-weight="800" fill="white">온</text>
<text x="155" y="108" font-size="38" font-weight="800">같이온</text><text x="72" y="182" font-size="18" letter-spacing="3" fill="#5e7866">FAMILY TRIP PLANNER</text>
<text x="72" y="268" font-size="65" font-weight="800">자녀가 준비하고,</text><text x="72" y="350" font-size="65" font-weight="800">부모님이 고르는 여행</text>
<text x="75" y="406" font-size="25" fill="#526857">함께 고른 경험은 남기고, 걷는 방식과 일정을 조정해요.</text>
<g transform="translate(1080 168)"><path d="M20 166C99 80 154 229 240 142S337 59 400 80" fill="none" stroke="#a5c191" stroke-width="5" stroke-dasharray="10 12"/><circle cx="20" cy="166" r="12" fill="#36744b"/><circle cx="240" cy="142" r="12" fill="#36744b"/><circle cx="400" cy="80" r="12" fill="#36744b"/><text x="0" y="215" font-size="20" fill="#526857">준비</text><text x="218" y="190" font-size="20" fill="#526857">선택</text><text x="378" y="130" font-size="20" fill="#526857">함께</text></g>
<g transform="translate(72 466)"><rect width="456" height="472" rx="28" fill="white"/><text x="28" y="48" font-size="17" fill="#618061" font-weight="700">01 · 자녀가 준비해요</text><text x="28" y="91" font-size="30" font-weight="800">우리 가족에게 맞는 후보</text><text x="28" y="127" font-size="20" fill="#647165">이동·식사 조건을 먼저 정해요.</text>
<rect x="28" y="163" width="400" height="258" rx="20" fill="#f4f7f0"/><text x="49" y="199" font-size="18" font-weight="700">여행 준비</text><g font-size="18" fill="#516b58"><rect x="48" y="219" width="359" height="48" rx="12" fill="white"/><text x="64" y="250">이동 방식</text><text x="269" y="250" fill="#36744b">차량 동반</text><rect x="48" y="279" width="359" height="48" rx="12" fill="white"/><text x="64" y="310">걷기와 휴식</text><text x="251" y="310" fill="#36744b">조건 확인</text></g><rect x="48" y="348" width="359" height="49" rx="13" fill="#36744b"/><text x="228" y="380" text-anchor="middle" font-size="19" font-weight="700" fill="white">후보 추리기</text></g>
<g transform="translate(572 466)"><rect width="456" height="472" rx="28" fill="white"/><text x="28" y="48" font-size="17" fill="#618061" font-weight="700">02 · 부모님이 골라요</text><text x="28" y="91" font-size="30" font-weight="800">말 대신, 간단한 선택으로</text><text x="28" y="127" font-size="20" fill="#647165">좋아요·별로예요·건너뛰기로 답해요.</text>
<rect x="28" y="163" width="400" height="258" rx="20" fill="#f4f7f0"/><rect x="48" y="185" width="359" height="126" rx="15" fill="#dcebcf"/><path d="M48 284L136 215 214 274 295 206 407 287V311H48Z" fill="#b4cca4"/><circle cx="352" cy="211" r="13" fill="#fff5c8"/><text x="68" y="295" font-size="19" font-weight="700">풍경을 천천히 즐기는 시간</text><g font-size="17" font-weight="700"><rect x="48" y="333" width="111" height="45" rx="13" fill="#36744b"/><text x="103" y="363" text-anchor="middle" fill="white">좋아요</text><rect x="171" y="333" width="111" height="45" rx="13" fill="white"/><text x="226" y="363" text-anchor="middle">별로예요</text><rect x="294" y="333" width="113" height="45" rx="13" fill="white"/><text x="350" y="363" text-anchor="middle">건너뛰기</text></g><text x="49" y="405" font-size="16" fill="#647165">꼭 하고 싶은 경험도 함께 기록해요.</text></g>
<g transform="translate(1072 466)"><rect width="456" height="472" rx="28" fill="white"/><text x="28" y="48" font-size="17" fill="#618061" font-weight="700">03 · 함께 확인해요</text><text x="28" y="91" font-size="30" font-weight="800">경험은 지키고, 일정은 조율</text><text x="28" y="127" font-size="20" fill="#647165">관람과 짧은 접근의 두 대안을 비교해요.</text>
<rect x="28" y="163" width="400" height="258" rx="20" fill="#f4f7f0"/><rect x="48" y="186" width="172" height="123" rx="15" fill="white"/><rect x="234" y="186" width="173" height="123" rx="15" fill="#e2efda"/><g font-size="20" font-weight="700"><text x="66" y="219">A안</text><text x="252" y="219">B안</text></g><g font-size="17" fill="#647165"><text x="66" y="251">관람을 더 남기기</text><text x="252" y="251">짧은 접근 중심</text><text x="66" y="285">경험 · 보행 비교</text><text x="252" y="285">경험 · 보행 비교</text></g><text x="48" y="343" font-size="18" fill="#516b58">두 분의 확인 후 같은 일정으로 확정</text><rect x="48" y="364" width="359" height="37" rx="12" fill="white"/><text x="228" y="390" text-anchor="middle" font-size="17" fill="#36744b">완료한 구간은 유지 · 남은 일정만 수정</text></g>
<text x="75" y="996" font-size="18" fill="#6b7b69">브라우저에서 체험하는 초기 프로토타입 · 위 화면은 기능 설명용 도식 · 장소와 일정은 가상 데이터</text>
</g></g></svg>
